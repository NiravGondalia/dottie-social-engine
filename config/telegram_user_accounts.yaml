# =============================================================================
# Telegram User Account Configuration (Telethon) — non-secret settings
# =============================================================================
# Secrets from .env:
#   MILO_TELEGRAM_USER_1_PHONE=+1...
#   MILO_TELEGRAM_USER_1_API_ID=...
#   MILO_TELEGRAM_USER_1_API_HASH=...
# =============================================================================

accounts:
  - phone: ""
    api_id: ""
    api_hash: ""
    session_file: "data/sessions/telegram_user1.session"
    enabled: false
    persona: "auto"
    assigned_projects: ["Dottie"]
    cooldown_minutes: 15
    max_messages_per_hour: 8
    target_groups:
      - "auto"
