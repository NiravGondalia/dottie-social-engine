# =============================================================================
# LLM Provider Configuration
# =============================================================================
# API keys are env-only — set in .env for HTTP backends:
#   MILO_GROQ_API_KEY=...
#   MILO_GEMINI_API_KEY=...
#   MILO_ANTHROPIC_API_KEY=...
#   MILO_OLLAMA_API_KEY=ollama   # optional; defaults to "ollama"
#
# Codex CLI uses the logged-in `codex` binary (no Groq key).
# =============================================================================

providers:
  codex:
    enabled: true
    transport: cli
    command: ["codex", "exec"]
    # Empty model = Codex CLI default from ~/.codex/config.toml
    model: ""
    timeout: 180
    sandbox: read-only
    output_schema: config/codex_keepers.schema.json

  groq:
    enabled: false
    priority: 2
    base_url: "https://api.groq.com/openai/v1"
    model: "qwen/qwen3.6-27b"
    max_tokens: 1024
    temperature: 0.7
    extra_body:
      reasoning_effort: none

  gemini:
    enabled: false
    priority: 3
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    model: "gemini-2.0-flash"
    max_tokens: 1024
    temperature: 0.7

  ollama:
    enabled: false
    priority: 4
    base_url: "http://localhost:11434/v1"
    model: "llama3.2:3b"
    max_tokens: 1024
    temperature: 0.7

  claude:
    enabled: false
    priority: 5
    base_url: "https://api.anthropic.com/v1"
    model: "claude-sonnet-4-5-20250929"
    max_tokens: 1024
    temperature: 0.7

fallback_chain: ["codex"]

routing:
  creative: ["codex"]
  analytical: ["codex"]
